[project]
name = "miniproject"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "nminh0402", email = "minhpro0402@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.2",
    "pdf2image>=1.17.0",
    "pillow>=12.3.0",
    "pymupdf>=1.28.2",
    "pypdfium2>=5.13.0",
    "streamlit>=1.65.0",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
]

[project.scripts]
miniproject = "miniproject:main"

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cu128"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
